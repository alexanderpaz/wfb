# Local development and E2E stack. Not used by Coolify.
#   docker compose -f deploy/docker-compose.dev.yml up -d                       # postgres, redis, openldap
#   docker compose -f deploy/docker-compose.dev.yml --profile authentik up -d   # + Authentik (OIDC)
name: wfb-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wfb
      POSTGRES_PASSWORD: wfb
      POSTGRES_DB: wfb
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wfb -d wfb']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  openldap:
    image: osixia/openldap:1.5.0
    command: ['--copy-service', '--loglevel', 'info']
    environment:
      LDAP_ORGANISATION: Example
      LDAP_DOMAIN: example.org
      LDAP_ADMIN_PASSWORD: admin
      LDAP_READONLY_USER: 'true'
      LDAP_READONLY_USER_USERNAME: readonly
      LDAP_READONLY_USER_PASSWORD: readonly
    ports:
      - '1389:389'
    volumes:
      - ./ldap/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-bootstrap.ldif:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'ldapsearch -x -H ldap://localhost -b dc=example,dc=org -D cn=admin,dc=example,dc=org -w admin uid=alice | grep -q numEntries',
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  authentik-postgres:
    profiles: [authentik]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik
      POSTGRES_DB: authentik
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U authentik -d authentik']
      interval: 5s
      timeout: 5s
      retries: 20

  authentik-redis:
    profiles: [authentik]
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  authentik-server:
    profiles: [authentik]
    image: ghcr.io/goauthentik/server:2024.10.4
    command: server
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: dev-only-authentik-secret-key-change-me-0123456789
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_BOOTSTRAP_PASSWORD: akadmin-dev
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@example.org
      AUTHENTIK_ERROR_REPORTING__ENABLED: 'false'
      AUTHENTIK_DISABLE_UPDATE_CHECK: 'true'
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: 'true'
    ports:
      - '9000:9000'
    volumes:
      - ./authentik/blueprints:/blueprints/custom:ro
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy

  authentik-worker:
    profiles: [authentik]
    image: ghcr.io/goauthentik/server:2024.10.4
    command: worker
    environment: *authentik-env
    volumes:
      - ./authentik/blueprints:/blueprints/custom:ro
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
