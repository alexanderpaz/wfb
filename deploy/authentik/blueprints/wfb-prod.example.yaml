# Production example: OIDC provider + application "wfb", a `groups` scope and an
# access group. Guide: docs/identity.md
#
# Usage: copy it into the Authentik blueprints folder (/blueprints/custom in the
# worker, or upload it in Customization > Blueprints) and set on the Authentik
# server and worker:
#   WFB_DOMAIN=archivos.example.com
#   WFB_OIDC_CLIENT_SECRET=<long random secret, same value as OIDC_CLIENT_SECRET in Coolify>
# Not instantiated automatically: enable it from Customization > Blueprints.
version: 1
metadata:
  name: wfb-prod
  labels:
    blueprints.goauthentik.io/instantiate: 'false'
entries:
  # Only members of this group can open the application.
  - model: authentik_core.group
    id: group-wfb-users
    identifiers:
      name: wfb-users
    attrs:
      name: wfb-users

  # Explicit `groups` scope: list of the user's group names, used by shares.yaml ACLs.
  - model: authentik_providers_oauth2.scopemapping
    id: scope-groups
    identifiers:
      managed: wfb/scope-groups
    attrs:
      name: 'wfb: groups'
      scope_name: groups
      description: Grupos del usuario
      expression: |
        return {"groups": [group.name for group in request.user.ak_groups.all()]}

  - model: authentik_providers_oauth2.oauth2provider
    id: provider-wfb
    identifiers:
      name: wfb
    attrs:
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: wfb
      client_secret: !Env [WFB_OIDC_CLIENT_SECRET, change-me]
      redirect_uris:
        - matching_mode: strict
          url: !Format ['https://%s/api/auth/oidc/callback', !Env [WFB_DOMAIN, archivos.example.com]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # Stable subject even if the username changes; wfb uses preferred_username as the login name.
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      access_code_validity: minutes=1
      access_token_validity: minutes=10
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-openid],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-email],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-profile],
          ]
        - !KeyOf scope-groups

  - model: authentik_core.application
    id: app-wfb
    identifiers:
      slug: wfb
    attrs:
      name: Explorador de archivos
      provider: !KeyOf provider-wfb
      meta_launch_url: !Format ['https://%s/', !Env [WFB_DOMAIN, archivos.example.com]]
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-wfb
      group: !KeyOf group-wfb-users
    attrs:
      order: 0
      enabled: true
      negate: false
      timeout: 30
