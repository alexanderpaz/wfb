# Development / E2E blueprint: OIDC provider + application "wfb" and test users.
# Applied automatically by Authentik from /blueprints/custom.
version: 1
metadata:
  name: wfb-dev
  labels:
    blueprints.goauthentik.io/instantiate: 'true'
entries:
  - model: authentik_core.group
    id: group-engineering
    identifiers:
      name: engineering
    attrs:
      name: engineering

  - model: authentik_core.group
    id: group-finance
    identifiers:
      name: finance
    attrs:
      name: finance

  - model: authentik_core.user
    identifiers:
      username: dave
    attrs:
      name: Dave Dev
      email: dave@example.org
      password: dave12345
      is_active: true
      groups:
        - !KeyOf group-engineering

  - model: authentik_core.user
    identifiers:
      username: erin
    attrs:
      name: Erin Finance
      email: erin@example.org
      password: erin12345
      is_active: true
      groups:
        - !KeyOf group-finance

  - model: authentik_providers_oauth2.oauth2provider
    id: provider-wfb
    identifiers:
      name: wfb
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: wfb
      client_secret: wfb-dev-secret
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:3000/api/auth/oidc/callback
        - matching_mode: strict
          url: http://localhost:5173/api/auth/oidc/callback
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_username
      include_claims_in_id_token: true
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    identifiers:
      slug: wfb
    attrs:
      name: Explorador de archivos
      provider: !KeyOf provider-wfb
      policy_engine_mode: any
