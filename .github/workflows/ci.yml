name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: wfb:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate Coolify compose
        run: docker compose -f docker-compose.yml config --quiet
        env:
          SHARES_CONFIG_HOST_PATH: ./config/shares.example.yaml
          SERVICE_USER_POSTGRES: ci
          SERVICE_PASSWORD_POSTGRES: ci
          SERVICE_PASSWORD_REDIS: ci
          SERVICE_BASE64_64_SESSION: ci
          SERVICE_URL_APP: https://wfb.example.org

  e2e:
    name: e2e (playwright)
    if: ${{ hashFiles('e2e/package.json') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wfb/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e:stack
      - run: pnpm e2e
      - if: failure()
        run: docker compose -f deploy/docker-compose.dev.yml --profile authentik logs --tail 200
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
