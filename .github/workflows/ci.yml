name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          # Tagged as the compose project image so the smoke test runs it without rebuilding.
          tags: wfb-ci-app:latest
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image size
        run: docker image ls wfb-ci-app:latest
      - name: Validate Coolify compose
        run: docker compose -f docker-compose.yml config --quiet
      - name: Smoke test compose stack
        run: |
          mkdir -p "$SHARES_HOST_PATH"/public "$SHARES_HOST_PATH"/engineering "$SHARES_HOST_PATH"/finance
          docker compose -p wfb-ci up -d --no-build --wait --wait-timeout 180
          docker compose -p wfb-ci exec -T app node -e \
            "fetch('http://127.0.0.1:3000/api/healthz').then(r=>r.json()).then(b=>{console.log(b);process.exit(b.status==='ok'?0:1)})"
      - if: failure()
        run: docker compose -p wfb-ci logs --tail 200
      - if: always()
        run: docker compose -p wfb-ci down -v
    env:
      SERVICE_USER_POSTGRES: ci
      SERVICE_PASSWORD_POSTGRES: ci-postgres-password
      SERVICE_PASSWORD_REDIS: ci-redis-password
      SERVICE_BASE64_64_SESSION: ci-session-secret-0123456789abcdef0123456789abcdef
      SERVICE_URL_APP: https://wfb.example.org
      SHARES_HOST_PATH: ${{ github.workspace }}/.ci-shares
      PUID: '1001'
      PGID: '1001'

  e2e:
    name: e2e (playwright)
    if: ${{ hashFiles('e2e/package.json') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wfb/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e:stack
      - run: pnpm e2e
      - if: failure()
        run: docker compose -f deploy/docker-compose.dev.yml --profile authentik logs --tail 200
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
