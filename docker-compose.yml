# Production stack for Coolify ("Docker Compose" build pack). Guide: deploy/COOLIFY.md
#
# Coolify generates the SERVICE_* variables and routes the domain set for the
# `app` service to port 3000 through its proxy, so no host ports are published.
# SHARES_HOST_PATH and SHARES_CONFIG_HOST_DIR must be set in Coolify before deploying (they are
# marked required through the app's environment). Volume sources only use plain `${VAR}`:
# Coolify rejects `${VAR:?message}` there as unsafe.
#
# Local test with simulated Coolify variables (see deploy/COOLIFY.md):
#   SERVICE_URL_APP=http://localhost:3000 SERVICE_USER_POSTGRES=wfb SERVICE_PASSWORD_POSTGRES=pw \
#   SERVICE_PASSWORD_REDIS=pw SERVICE_BASE64_64_SESSION=$(openssl rand -base64 48) \
#   SHARES_HOST_PATH=/srv/fileshares docker compose -p wfb-prodtest up -d --build
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_LIBREOFFICE: ${INSTALL_LIBREOFFICE:-false}
        VERSION: ${APP_VERSION:-0.1.0}
        REVISION: ${SOURCE_COMMIT:-unknown}
    # Must be able to read (and write, for write/delete ACLs) SHARES_HOST_PATH.
    user: '${PUID:-1000}:${PGID:-1000}'
    restart: unless-stopped
    stop_grace_period: 30s
    expose:
      - '3000'
    environment:
      - SERVICE_FQDN_APP_3000
      - APP_URL=${SERVICE_URL_APP}
      # Optional override, e.g. https://files.example.com, when SERVICE_URL_APP is not the public domain.
      - PUBLIC_URL=${PUBLIC_URL:-}
      - NODE_ENV=production
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SHUTDOWN_TIMEOUT_SECONDS=${SHUTDOWN_TIMEOUT_SECONDS:-25}
      - SESSION_SECRET=${SERVICE_BASE64_64_SESSION}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-12}
      - LOGIN_RATE_LIMIT_PER_MINUTE=${LOGIN_RATE_LIMIT_PER_MINUTE:-10}
      # Coolify's Traefik reaches the app from a Docker network (default pool 172.16.0.0/12).
      - TRUST_PROXY=${TRUST_PROXY:-172.16.0.0/12}
      - DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-wfb}?schema=public
      - REDIS_URL=redis://default:${SERVICE_PASSWORD_REDIS}@redis:6379/0
      # Directory login (LDAP or Active Directory). DIRECTORY_KIND=none disables it.
      - DIRECTORY_KIND=${DIRECTORY_KIND:-none}
      - DIRECTORY_LABEL=${DIRECTORY_LABEL:-}
      - LDAP_URL=${LDAP_URL:-}
      - LDAP_BIND_DN=${LDAP_BIND_DN:-}
      - LDAP_BIND_PASSWORD=${LDAP_BIND_PASSWORD:-}
      - LDAP_BASE_DN=${LDAP_BASE_DN:-}
      - LDAP_USER_FILTER=${LDAP_USER_FILTER:-}
      - LDAP_GROUP_ATTRIBUTE=${LDAP_GROUP_ATTRIBUTE:-memberOf}
      - LDAP_START_TLS=${LDAP_START_TLS:-false}
      - LDAP_TLS_REJECT_UNAUTHORIZED=${LDAP_TLS_REJECT_UNAUTHORIZED:-true}
      - AD_DOMAIN=${AD_DOMAIN:-}
      # Private CA for LDAPS/StartTLS or the OIDC issuer (file inside SHARES_CONFIG_HOST_DIR).
      - NODE_EXTRA_CA_CERTS=${NODE_EXTRA_CA_CERTS:-}
      # OIDC (Authentik). Empty OIDC_ISSUER disables it.
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_SCOPES=${OIDC_SCOPES:-openid profile email groups}
      - OIDC_GROUPS_CLAIM=${OIDC_GROUPS_CLAIM:-groups}
      - OIDC_LABEL=${OIDC_LABEL:-Authentik}
      - OIDC_TOKEN_AUTH_METHOD=${OIDC_TOKEN_AUTH_METHOD:-client_secret_post}
      # Storage. The two host paths are only used by `volumes`; listing them here makes Coolify
      # show them as required variables (it rejects `:?` in volume sources, not in environment).
      - SHARES_HOST_PATH=${SHARES_HOST_PATH:?}
      - SHARES_CONFIG_HOST_DIR=${SHARES_CONFIG_HOST_DIR:?}
      - SHARES_CONFIG_FILE=${SHARES_CONFIG_FILE:-shares.yaml}
      - SHARES_CONFIG=/config/${SHARES_CONFIG_FILE:-shares.yaml}
      - HOME_ROOT=${HOME_ROOT:-}
      - TRASH_DIR_NAME=${TRASH_DIR_NAME:-.wfb-trash}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-1024}
      - SYNC_TRANSFER_LIMIT_MB=${SYNC_TRANSFER_LIMIT_MB:-50}
      - OFFICE_PREVIEW=${INSTALL_LIBREOFFICE:-false}
    volumes:
      # Upload chunks and office preview cache.
      - app-data:/app/data
      # Thumbnail cache, safe to delete at any time.
      - app-thumbs:/app/data/thumbs
      # Host folder holding the shares; paths in shares.yaml live under /data/shares.
      # Long-form bind: the short form `${VAR}:/path` made Coolify create an empty named
      # volume instead of mounting the host directory.
      - type: bind
        source: ${SHARES_HOST_PATH}
        target: /data/shares
      # Folder with shares.yaml (hot reloaded). Must be an absolute host path: Coolify resolves
      # relative paths against its application folder, not the repository, and Docker would
      # mount an empty directory in their place.
      - type: bind
        source: ${SHARES_CONFIG_HOST_DIR}
        target: /config
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=${POSTGRES_DB:-wfb}
      - TZ=${TZ:-UTC}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # pg_dump target for the scheduled backup task (deploy/COOLIFY.md). Repo files cannot be
      # bind mounted: Coolify maps ./ to its application folder, which has no checkout.
      - postgres-backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Sessions and upload state: never evict keys, persist with AOF.
    command:
      [
        'redis-server',
        '--requirepass',
        '${SERVICE_PASSWORD_REDIS}',
        '--appendonly',
        'yes',
        '--maxmemory',
        '${REDIS_MAXMEMORY:-256mb}',
        '--maxmemory-policy',
        'noeviction',
      ]
    environment:
      - REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  app-data:
  app-thumbs:
  postgres-data:
  postgres-backups:
  redis-data:
